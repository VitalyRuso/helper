services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  api:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-spain_helper}
      ACCESS_KEYS: ${ACCESS_KEYS:?ACCESS_KEYS is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      LOCAL_WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:?LOCAL_WORKER_TOKEN is required}
      LEGAL_COLLECTOR_TOKEN: ${LEGAL_COLLECTOR_TOKEN:?LEGAL_COLLECTOR_TOKEN is required}
      CORS_ORIGINS: https://${PUBLIC_HOST:?PUBLIC_HOST is required}

  web:
    build:
      args:
        VITE_API_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
